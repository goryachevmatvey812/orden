<script>
const W={
home:{t:'Главная',h:`<p>Энциклопедия мультивселенной Ордена: вселенная, лор, персонажи, техника. Ниже сообщество: вопросы, фанатское творчество и общий чат.</p><p class="card"><b>Девиз:</b> «Служим Ордену. Сталь не гнётся.»</p><div class="hub" id="hub"></div><div id="fx"></div>`},
uni:{t:'Вселенная',h:`<h2>Что такое Орден</h2><p>Военно-политическая структура. Началась как частная военная компания в мире, похожем на Землю XXI века, затем захватила родную планету, вышла в космос, открыла межпространственные переходы и создала Коалицию Миров.</p><h2>Ключевые идеи</h2><p><b>Петля:</b> чтобы получить знание, иногда необходимо причинить вред. Это констатация, а не оправдание. Орден не добро и не зло, а необходимость.</p><p>Язык Ордена русский. В документах враг это «лицо, отдалённое от сотрудничества», в быту просто «враг».</p><h2>Структура</h2><div class="tw"><table><tr><th>Часть</th><th>Роль</th></tr><tr><td>ШТАБ-Командас</td><td>«Мозг»: ВРШС, ГУСО, КУБ, КУСПА, СОБ, ОКК, 1-ОКПЭ, Инквизиция, Совет («Круг», 13 членов)</td></tr><tr><td>Амбрелла</td><td>«Руки»: 1-й Научный, 2-й Логический, 3-й Вооружённый, 4-й Политический корпуса</td></tr><tr><td>Комиссары</td><td>Люди, представители ШТАБа внутри Амбреллы; не подчиняются командирам</td></tr></table></div><h2>Миры Коалиции</h2><p>Ядро, Кузницы, Житницы, Академии, Форпосты, Пустые миры, Протектораты, Миры-Аномалии. Восемь Цитаделей (Цитадель-8 уничтожена). Столица: планета «Царствие».</p>`},
lore:{t:'Лор',h:`<h2>История</h2><p>1. Эпоха ЧВК: основатель создаёт «Орден», пишет Устав, стремится стать третейским судьёй. 2. Выход в космос и первый контакт, закончившийся войной. 3. Мультивселенная. 4. Мятеж ШТАБ-Командас: Гендиректор активирует Протокол 224, мятеж подавлен.</p><h2>Гендиректор</h2><p>561973-П, «Девятихвостый». Всегда в чёрной матовой маске без глаз и рта. Лица не видел никто. Настоящее имя: <span class="rd">неизвестно даже Совету</span>. В казармах о нём ходят байки и слухи, но фактами они не являются.</p><h2>Протоколы</h2><p><b>224</b> Гендиректор объявляет структуру предателями (применялся). <b>204</b> Совет объявляет предателем Гендиректора (не применялся).</p><h2>Реформы</h2><p>Вторая Реформа пересмотрела понятие «враг». Директива-719 дала клонам имена, психологическую поддержку и выбор специализации.</p><h2>Клоны</h2><p>Генетический оригинал Иван Ковалёв «Купол» (3829). Инкубация 1 год, подготовка 2 года. Служат только в 3-м корпусе. Не говорят о «долге»: им в радость воевать.</p><h2>Враги</h2><p>Гвардия «Оммеог-6» (мятежные гвардейцы ШТАБа), дройды-автоматоны Предтеч, Улей терродилторов, армия «Воля», Культ «Разлома», «Кровавый Клык», «Красные Ножи».</p>`},
chars:{t:'Персонажи',h:`<div class="hub"><a class="card" href="#h-gen"><b>Гендиректор</b></a><a class="card" href="#h-verd"><b>Верд 3412</b></a><a class="card" href="#h-kein"><b>Кейн 88</b></a><a class="card" href="#h-luna"><b>Луна 3017</b></a><a class="card" href="#h-rubec"><b>Рубец 7405</b></a><a class="card" href="#h-klesh"><b>Клещ 8804</b></a><a class="card" href="#h-iskra"><b>Искра 9915</b></a><a class="card" href="#h-filka"><b>Филька 5193</b></a><a class="card" href="#h-korvo"><b>Корво</b></a></div><p class="mu">Любого героя можно сделать главным в своей истории. «Нельзя менять» обязательно для всех авторов.</p><div class="tw"><table><tr><th>Герой</th><th>Кто</th><th>Нельзя менять</th></tr><tr><td>Гендиректор 561973-П</td><td>Глава Ордена</td><td>Чёрная маска, безликость</td></tr><tr><td>Верд 3412 «Перелом»</td><td>Генерал-клон, 816-й легион</td><td>Путь от рядового до генерала</td></tr><tr><td>Кейн 88</td><td>Комиссар 3-го корпуса</td><td>Человек, валерьянка, рапорты</td></tr><tr><td>Луна 3017</td><td>Клон-унтер-офицер, 32-я рота</td><td>Дневник, философ, инструктор</td></tr><tr><td>Рубец 7405</td><td>Боец 32-й роты</td><td>Два топора, мороженое</td></tr><tr><td>Клещ 8804</td><td>Стрелок-специалист</td><td>Модели кораблей, отчёты</td></tr><tr><td>Искра 9915</td><td>Снайпер, 32-я рота</td><td>Спорщица, опыт Кхайнар-прайм</td></tr><tr><td>Филька 5193</td><td>Клон-генерал</td><td>Ветеран Метро-2033</td></tr><tr><td>Корво</td><td>Командир «Легиона»</td><td>Два топора, шрамы</td></tr><tr><td>Тень 0001</td><td>Командир Спецкорпуса</td><td>Лица не показывает</td></tr></table></div>`},
tech:{t:'Техника',h:`<h2>Броня</h2><p>«Панцирь-М2» (серо-белая, Т-визор, имплант-ключ, нейросеть), М2-Ти (танковая), М2-И (инженерная), М2-Е (медицинская). Элитная: «Легион», «Реквием», Золотая гвардия, Серебряные рыцари.</p><h2>Оружие</h2><p>Винтовка «Град», «Каратель-М», снайперские «Удар» и «Гроза», пулемёты «Оса» и «Гром», пистолеты «Жало» и «Заря», гравипушка «Гатлингор», вибро-клинки «Китленг».</p><h2>Техника</h2><p>Танк «Гроб», БМП «Хаммер», транспортёр «Саркофаг», САУ «Гром», РСЗО «Метла», «Волк», «Тайфун», «Кабан», «Рысь». Авиация: «Пузырь-М», «Дятел», «Гнездо».</p><h2>Флот</h2><p>Крейсер «Апполоний», линкор «Титан», носитель «Улей», транспорт «Ковчег», флагман «Керрас».</p>`},
ranks:{t:'Звания и знаки',h:`<div class="tw"><table><tr><th>Состав</th><th>Звание (сленг)</th><th>Накладка</th></tr><tr><td>Рядовые</td><td>Рядовой («Молоток»), 2-го класса («Старый молоток»)</td><td>Серая</td></tr><tr><td>Унтеры</td><td>Зубец, Хват, Мёртвый хват</td><td>Тёмно-зелёная</td></tr><tr><td>Офицеры</td><td>Тяга, Упор, Перелом</td><td>Белая</td></tr><tr><td>Высшие клоны</td><td>Клон Сердан («Вторая кожа»), Клон-капитан («Стекло»)</td><td>Белая с чёрной окантовкой</td></tr><tr><td>Генералы</td><td>Генерал-клон («Позвонок»)</td><td>Красная с чёрным</td></tr></table></div><h2>Цвета подразделений</h2><p>816-й легион красный, 817-я дивизия оранжевый, 319-й легион ярко-зелёный, 018-й легион голубой, 63-я дивизия синий, 38-я дивизия белый с красным крестом.</p>`}

W.rules={t:'Правила',h:`<p>Уважайте участников и канон Ордена. Критиковать идеи можно, людей нельзя.</p><h2>Наказания</h2><div class="tw"><table><tr><th>Нарушение</th><th>Первый раз</th><th>Повтор</th></tr><tr><td>Мат и грубость</td><td>предупреждение</td><td>мут 1 ч, затем 24 ч</td></tr><tr><td>Оскорбление участника</td><td>мут 24 ч</td><td>бан 7 дней</td></tr><tr><td>Спам, флуд, реклама</td><td>мут 1 ч</td><td>мут 24 ч; массовая реклама: бан 30 дней</td></tr><tr><td>Троллинг, провокации</td><td>мут 24 ч</td><td>бан 7 дней</td></tr><tr><td>Дискриминация, разжигание ненависти</td><td>бан 30 дней</td><td>бан навсегда</td></tr><tr><td>Плагиат в творчестве</td><td>удаление работы и предупреждение</td><td>бан 7 дней</td></tr><tr><td>Оффтоп</td><td>предупреждение</td><td>мут 1 ч</td></tr><tr><td>Обход мута или бана</td><td>бан 30 дней</td><td>бан навсегда</td></tr></table></div><h2>Бан навсегда сразу</h2><p>Угрозы и травля. Публикация чужих личных данных. Сексуальный контент, любой сексуальный контент с участием детей. Призывы к насилию. Мошенничество, фишинговые и вредоносные ссылки. Попытки взломать или навредить сайту.</p><h2>Благодарности</h2><p>За помощь новичкам, точные ответы, ценный вклад в канон, качественное творчество и найденные ошибки владелец ставит ★ в списке участников. Особо отличившихся он может отметить званием по своему решению.</p><h2>Апелляция</h2><p>Напишите владельцу в разделе «Вопросы» в течение 7 дней. Срок наказания можно смягчить или увеличить по ситуации.</p><p class="mu">Решения принимают владелец и назначенные им администраторы.</p>`};
W.time={t:'Хронология',h:`<div class="tw"><table><tr><th>Эпоха</th><th>События</th></tr><tr><td>Эпоха ЧВК</td><td>Основатель создаёт ЧВК «Орден», пишет Устав с философией Петли. Орден становится тайным правительством планеты. Генный оригинал клонов Иван Ковалёв «Купол» (3829).</td></tr><tr><td>Выход в космос</td><td>Первый контакт с инопланетной расой заканчивается войной. Орден захватывает технологии межпространственных переходов.</td></tr><tr><td>Мультивселенная</td><td>Экспансия в бесчисленные миры, создание Коалиции, строительство Цитаделей.</td></tr><tr><td>Мятеж ШТАБ-Командас</td><td>Попытка захватить власть. Гендиректор активирует Протокол 224. Ковалёв гибнет, защищая его кабинет. ШТАБ переформирован.</td></tr><tr><td>Реформы</td><td>Вторая Реформа пересматривает понятие «враг». Директива-719 даёт клонам имена, психологическую поддержку и выбор специализации.</td></tr><tr><td>Наши дни</td><td>4825 год. Более пятидесяти миров, восемь Цитаделей (восьмая уничтожена), флот, легионы, союзники.</td></tr></table></div><h2>Эволюция брони</h2><p>«Панцирь-1» (ок. 2250), «Панцирь-М» (ок. 2550), М1 (ок. 3450), М2 (ок. 4250, стандарт), М3 (4820, экспериментальная).</p>`};
W.gloss={t:'Глоссарий',h:`<div class="tw"><table><tr><th>Термин</th><th>Значение</th></tr><tr><td>Петля</td><td>Принцип: знание требует жертв. Констатация, не оправдание.</td></tr><tr><td>Протокол 224</td><td>Гендиректор объявляет структуру предателями. Применялся один раз.</td></tr><tr><td>Протокол 204</td><td>Совет объявляет предателем Гендиректора. Не применялся.</td></tr><tr><td>СКАОС</td><td>Классификация аномалий, классы 0-5 (от безопасного до мультивселенской угрозы).</td></tr><tr><td>Допуски</td><td>От 0 (открытый) до 5 («Чёрный», только Гендиректор).</td></tr><tr><td>Амбрелла</td><td>Исполнительные корпуса, «руки» Ордена.</td></tr><tr><td>ШТАБ-Командас</td><td>Управление, «мозг» Ордена.</td></tr><tr><td>Комиссар</td><td>Человек, представитель ШТАБа в Амбрелле.</td></tr><tr><td>Директива-719</td><td>Права клонов: имя, психоподдержка, выбор специализации.</td></tr><tr><td>Тогдалик</td><td>Высшее звание, связующее звено с ШТАБом («Мост», «Шов»).</td></tr><tr><td>«Свежак»</td><td>Молодой клон после подготовки.</td></tr><tr><td>«Сачки» / «Тихие»</td><td>4-е отделение (захват аномалий) / 3-е (спецназначения).</td></tr><tr><td>Чёрный венок</td><td>Высшая награда клона, вплавляется в шлем. Венки: медный, серебряный, золотой, чёрный.</td></tr></table></div>`};
W.units={t:'Подразделения',h:`<div class="tw"><table><tr><th>Часть</th><th>Командир</th><th>Особенность</th></tr><tr><td>816-й штурмовой легион</td><td>Верд 3412</td><td>Флагман, красная полоса</td></tr><tr><td>333-й общего назначения</td><td>Миротворец 3719</td><td>Серая полоса</td></tr><tr><td>817-я гренадерская дивизия</td><td>Гранит 4507</td><td>Оранжевая, лучевые ружья</td></tr><tr><td>55-й «Сторожа»</td><td>Бастион</td><td>Гарнизонный, оборона</td></tr><tr><td>77-й «Стальная стена»</td><td>Таран</td><td>Бронетанковый</td></tr><tr><td>101-й тяжёлого оружия</td><td>Натиск</td><td>Огневая мощь</td></tr><tr><td>404-й «Сачки»</td><td>Сеть</td><td>Захват аномалий</td></tr><tr><td>888-й «Тихие»</td><td>Шёпот</td><td>Спецоперации</td></tr><tr><td>501-й «Память Республики»</td><td>Хроник</td><td>Серебристо-серый с синим кантом</td></tr><tr><td>28-я егерская дивизия</td><td></td><td>Лес и джунгли, зелёная полоса</td></tr><tr><td>319-й снабжения (2-й корпус)</td><td></td><td>Люди, ярко-зелёная полоса</td></tr><tr><td>12-й инженерный «Зодчие» (2-й корпус)</td><td>Чертёж</td><td>Люди, оранжевая полоса</td></tr><tr><td>38-я санитарно-медицинская</td><td></td><td>Люди, белая с красным крестом</td></tr><tr><td>«Легион»</td><td>Корво</td><td>Личная гвардия Гендиректора, 200 человек</td></tr><tr><td>«Реквием»</td><td></td><td>Космодесант, чёрно-синяя броня</td></tr><tr><td>13-я рота спецразведки</td><td></td><td>Тёмно-бордовая полоса</td></tr></table></div><p class="mu">Клоны служат только в 3-м Вооружённом корпусе.</p>`};
W.auth={t:'Для авторов',h:`<h2>Тон</h2><p>Суровая военная драма с проблесками мрачного юмора. Не гримдарк и не утопия.</p><h2>Табу</h2><p>Слово «Спарта» не используется. Гендиректор всегда в чёрной маске, лица никто не видел. Клоны не бывают комиссарами и не служат вне 3-го корпуса.</p><h2>Язык</h2><p>Русский. Клоны говорят коротко и формально. В документах враг это «лицо, отдалённое от сотрудничества».</p><h2>Как писать историю</h2><p>Выберите героя любого уровня, сохраните его факты из раздела «Нельзя менять», укажите эпоху (до или после мятежа, до или после Директивы-719). Вокруг героя можно придумывать сослуживцев, эпизоды и миры.</p>`};

function curKey(){const h=(location.hash||'#home').slice(1);if(h==='chat'){const T=CURT;if(T.t==='pub')return 'chat:'+T.id;if(T.t==='p')return 'p:'+T.cid+':'+T.id;if(T.t==='dm')return 'dm:'+dmPair(uid,T.id)}if(h==='home')return 'news';if(['board','qa','fan','gal'].indexOf(h)>-1)return h;return ''}
function sumKeys(f){let n=0;for(const k in UN)if(f(k))n+=UN[k];return n}
function grpCount(g){return g==='e'?sumKeys(k=>k==='news'||k==='board'):g==='c'?sumKeys(k=>k.indexOf('chat:')===0||k.indexOf('p:')===0||k.indexOf('dm:')===0):g==='m'?sumKeys(k=>k==='qa'||k==='fan'||k==='gal'):g==='a'?(UN.rep||0):0}
function keyOfHash(h){return h==='home'?'news':(['board','qa','fan','gal','rep'].indexOf(h)>-1?h:'')}
function pill(n,c){return n?'<i class="bdg" style="--bc:'+c+'">'+(n>99?'99+':n)+'</i>':''}
function updBadges(){
 document.querySelectorAll('nav a[href^="#"]').forEach(a=>{a.querySelectorAll('.bdg').forEach(x=>x.remove());const h=a.getAttribute('href').slice(1);let n=0,c='#ef4444';
  if(a.closest('.gn')){const g=grpOf(h);n=grpCount(g);c=g==='c'?'#ef4444':g==='e'?'#3b82f6':g==='m'?'#f59e0b':'#f97316'}
  else if(h==='chat'){n=grpCount('c')}
  else{const k=keyOfHash(h);n=k?(UN[k]||0):0;c=k?BC(k):c}
  if(n)a.insertAdjacentHTML('beforeend',pill(n,c))});
 document.querySelectorAll('#bn a').forEach(a=>{a.querySelectorAll('.bdg').forEach(x=>x.remove());const h=a.getAttribute('href').slice(1);if(h==='home'||h==='chat'||h==='qa'){const g=grpOf(h),n=grpCount(g);if(n)a.insertAdjacentHTML('beforeend',pill(n,g==='c'?'#ef4444':g==='e'?'#3b82f6':'#f59e0b'))}});
 const tot=['e','c','m','a'].reduce((s,g)=>s+grpCount(g),0);const base=(document.title||'').replace(/^\(\d+\+?\)\s*/,'');document.title=(tot?'('+(tot>99?'99+':tot)+') ':'')+base;
 try{if(navigator.setAppBadge){tot?navigator.setAppBadge(tot):navigator.clearAppBadge()}}catch(e){}}
function recount(){const old=JSON.stringify(UN);UN={};
 const mine=d=>d.by!==uid&&!blockedBy(d.by);
 (UD.chat||[]).forEach(d=>{if(!mine(d))return;const k='chat:'+(d.room||'gen');if(d.ts>seenTs(k))UN[k]=(UN[k]||0)+1});
 ['qa','fan','gal','news','board'].forEach(c=>{(UD[c]||[]).forEach(d=>{if((c==='news'||c==='board'||mine(d))&&d.ts>seenTs(c))UN[c]=(UN[c]||0)+1})});
 Object.keys(INB).forEach(p=>{const t=INB[p];if(t.by!==uid&&t.ts>seenTs('dm:'+p))UN['dm:'+p]=1});
 Object.keys(PUL).forEach(k=>{const a=PUL[k].docs||[];a.forEach(d=>{if(mine(d)&&d.ts>seenTs(k))UN[k]=(UN[k]||0)+1})});
 if(UD.rep)UN.rep=UD.rep.filter(d=>d.st!=='done').length;
 if(JSON.stringify(UN)!==old){updBadges();if(typeof CHATR==='function'&&document.getElementById('sb'))try{CHATR()}catch(e){}}}
function ensurePriv(){Object.keys(PCH).forEach(cid=>Object.keys(PRM[cid]||{}).forEach(rid=>{const k='p:'+cid+':'+rid;if(PUL[k])return;PUL[k]={docs:[]};PUL[k].un=db.collection('pchans').doc(cid).collection('rooms').doc(rid).collection('msgs').orderBy('ts','desc').limit(50).onSnapshot(s=>{PUL[k].docs=s.docs.map(d=>d.data());recount()},()=>{})}))}
function markSeen(){if(document.hidden)return;const k=curKey();if(k!==_lk){_lk=k;if(k)ENTER[k]=seenTs(k)}if(!k)return;const now=Date.now();let ch=false;if(UN[k]||!SEEN[k]){SEEN[k]=now;ch=true}else if(now-(SEEN[k]||0)>4000){SEEN[k]=now;ch=true}if(ch){saveSeen();recount()}}
function startUnread(){if(_un||!db||!uid)return;_un=true;
 ['chat','qa','fan','gal','news','board'].forEach(c=>{db.collection(c).orderBy('ts','desc').limit(100).onSnapshot(s=>{UD[c]=s.docs.map(d=>d.data());recount()},()=>{})});
 setInterval(()=>{ensurePriv();if(!_rl&&can('reports')){_rl=true;db.collection('reports').orderBy('ts','desc').limit(200).onSnapshot(s=>{UD.rep=s.docs.map(d=>d.data());recount()},()=>{})}markSeen();recount()},1500);
 addEventListener('hashchange',()=>setTimeout(()=>{markSeen();updBadges()},60));document.addEventListener('visibilitychange',()=>markSeen())}
(function(){const sv=startV3;startV3=function(){sv();startUnread()};const bn=buildNav;buildNav=function(){const r=bn.apply(this,arguments);updBadges();return r}})();

/* ===== V7: голосовые сообщения и звонки ===== */
var AUDP=null,REC=null,CALL=null,RING=null,_vc=false;
const TURN={url:'',user:'',pass:''}; // при необходимости впишите свой TURN-сервер: url (можно несколько через запятую), user, pass
function iceServers(){const a=[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:stun.stunprotocol.org:3478'}];if(TURN.url)a.push({urls:TURN.url.split(','),username:TURN.user,credential:TURN.pass});return a}
function mmss(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function safeAud(u){return /^data:audio\//.test(u||'')?u:''}
function audHtml(d){const a=safeAud(d.aud);return a?'<div class="aud"><audio controls preload="none" src="'+esc(a)+'"></audio>'+(d.dur?' <span class="mu">'+mmss(d.dur)+'</span>':'')+'</div>':''}
/* ---- запись голосового сообщения ---- */
function bindMic(){const b=document.getElementById('mic'),cp=document.getElementById('cp');if(!b||!cp)return;
 const stopRec=()=>{if(REC&&REC.mr&&REC.mr.state!=='inactive')REC.mr.stop()};
 b.onclick=async()=>{
  if(REC){stopRec();return}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){toast(X('Запись голоса не поддерживается этим браузером','Voice recording is not supported here'));return}
  const bl=blocked();if(bl){toast(bl);return}
  try{const st=await navigator.mediaDevices.getUserMedia({audio:true});
   const types=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'],mt=types.find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||'';
   const mr=new MediaRecorder(st,mt?{mimeType:mt,audioBitsPerSecond:24000}:{audioBitsPerSecond:24000}),ch=[],t0=Date.now();
   REC={mr:mr,st:st};b.textContent='⏹';b.classList.add('rec');AUDP=null;
   const tick=setInterval(()=>{const s=(Date.now()-t0)/1000;cp.innerHTML='<span class="recdot">●</span> '+X('Запись ','Recording ')+mmss(s)+' / 1:00 <button class="g" id="rcx">✕</button>';const x=document.getElementById('rcx');if(x)x.onclick=()=>{if(REC)REC.cancel=true;stopRec()};if(s>=60)stopRec()},300);
   mr.ondataavailable=e=>{if(e.data&&e.data.size)ch.push(e.data)};
   mr.onstop=()=>{clearInterval(tick);st.getTracks().forEach(t=>t.stop());const cancel=REC&&REC.cancel;REC=null;b.textContent='🎤';b.classList.remove('rec');
    if(cancel){cp.innerHTML='';return}
    const blob=new Blob(ch,{type:mr.mimeType||mt||'audio/webm'}),dur=(Date.now()-t0)/1000;
    if(blob.size>700000){cp.innerHTML='';toast(X('Запись слишком длинная','Recording is too long'));return}
    const fr=new FileReader();fr.onload=()=>{AUDP={url:fr.result,dur:dur};cp.innerHTML='<audio controls src="'+fr.result+'"></audio> <button class="g" id="acx">✕</button> <span class="mu">'+X('Нажмите «Отправить»','Press Send')+'</span>';const x=document.getElementById('acx');if(x)x.onclick=()=>{AUDP=null;cp.innerHTML=''}};fr.readAsDataURL(blob)};
   mr.start()}catch(e){toast(X('Нет доступа к микрофону','No microphone access'))}}}
/* ---- звонки (WebRTC, сигналы через Firestore) ---- */
function ringStart(){ringStop();let n=0;const play=()=>{try{const A=new(window.AudioContext||window.webkitAudioContext)(),o=A.createOscillator(),g=A.createGain();o.type='sine';o.frequency.value=n%2?520:440;g.gain.value=.08*((S.vol==null?60:S.vol)/60);o.connect(g);g.connect(A.destination);o.start();setTimeout(()=>{try{o.stop();A.close()}catch(e){}},400);n++}catch(e){}};play();RING=setInterval(play,1200);try{if(navigator.vibrate)navigator.vibrate([300,200,300])}catch(e){}}
function ringStop(){if(RING){clearInterval(RING);RING=null}}
function callUi(){let d=document.getElementById('callui');if(!CALL){if(d)d.remove();return}
 if(!d){d=document.createElement('div');d.id='callui';document.body.appendChild(d)}
 const c=CALL,st=c.state==='active'?mmss((Date.now()-c.t0)/1000):(c.state==='ringing'&&c.role==='out')?X('вызов…','calling…'):c.state==='ringing'?X('входящий звонок','incoming call'):X('соединение…','connecting…');
 d.innerHTML='<div class="cu">'+avOf(c.peer)+'<div><b>'+esc(nameOf(c.peer))+'</b><div class="mu" id="cust">'+st+'</div></div><div class="cub">'+((c.role==='in'&&c.state==='ringing')?'<button id="cuy">📞 '+X('Принять','Accept')+'</button><button class="g" id="cun">✕</button>':'<button class="g" id="cum">'+(c.mute?'🔇':'🎤')+'</button><button id="cue">📵</button>')+'</div></div>';
 const q=s=>d.querySelector(s);
 if(q('#cuy'))q('#cuy').onclick=acceptCall;
 if(q('#cun'))q('#cun').onclick=()=>endCall('declined');
 if(q('#cue'))q('#cue').onclick=()=>endCall('ended');
 if(q('#cum'))q('#cum').onclick=()=>{c.mute=!c.mute;try{c.st.getAudioTracks().forEach(t=>t.enabled=!c.mute)}catch(e){}callUi()}}
setInterval(()=>{if(CALL&&CALL.state==='active'){const e=document.getElementById('cust');if(e)e.textContent=mmss((Date.now()-CALL.t0)/1000)}},1000);
function flushQ(){const c=CALL;if(!c||!c.pc||!c.q)return;while(c.q.length){try{c.pc.addIceCandidate(c.q.shift()).catch(()=>{})}catch(e){}}}
function watchIce(id){CALL.un.push(db.collection('calls').doc(id).collection('ice').onSnapshot(s=>{s.docChanges().forEach(ch=>{if(ch.type!=='added')return;const d=ch.doc.data();if(d.by===uid||!CALL||CALL.id!==id)return;let cand;try{cand=JSON.parse(d.c)}catch(e){return}CALL.q=CALL.q||[];if(CALL.pc&&CALL.pc.remoteDescription){try{CALL.pc.addIceCandidate(cand).catch(()=>{})}catch(e){}}else CALL.q.push(cand)})},()=>{}))}
function newPc(st,id){const pc=new RTCPeerConnection({iceServers:iceServers()});st.getTracks().forEach(t=>pc.addTrack(t,st));
 pc.onicecandidate=e=>{if(e.candidate)db.collection('calls').doc(id).collection('ice').add({by:uid,c:JSON.stringify(e.candidate)}).catch(()=>{})};
 pc.ontrack=e=>{let a=document.getElementById('callaud');if(!a){a=document.createElement('audio');a.id='callaud';a.autoplay=true;a.setAttribute('playsinline','');document.body.appendChild(a)}a.srcObject=e.streams[0];if(a.play)a.play().catch(()=>{})};
 pc.onconnectionstatechange=()=>{if(!CALL||CALL.pc!==pc)return;const s=pc.connectionState;
  if(s==='connected'&&CALL.state!=='active'){CALL.state='active';CALL.t0=Date.now();ringStop();clearTimeout(CALL.to);callUi()}
  if(s==='failed'){toast(X('Не удалось соединиться (возможно, нужен TURN-сервер)','Connection failed (a TURN server may be required)'));endCall('ended')}
  if(s==='disconnected'||s==='closed'){setTimeout(()=>{if(CALL&&CALL.pc===pc&&pc.connectionState!=='connected')endCall('ended')},4000)}};
 return pc}
async function startCall(peer){if(CALL){toast(X('Вы уже в звонке','You are already in a call'));return}
 if(!db||!uid||!peer)return;const bl=blocked();if(bl){toast(bl);return}
 const m=members[peer];if(m&&m.dmOpen===false){toast(X('Пользователь закрыл личные сообщения и звонки','This user has closed DMs and calls'));return}
 if(!window.RTCPeerConnection||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast(X('Звонки не поддерживаются этим браузером','Calls are not supported here'));return}
 let st;try{st=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){toast(X('Нет доступа к микрофону','No microphone access'));return}
 const id=Date.now()+'-'+rnd(),pc=newPc(st,id);CALL={id:id,pc:pc,st:st,peer:peer,role:'out',state:'ringing',t0:0,un:[],q:[],mute:false};callUi();ringStart();
 try{await db.collection('calls').doc(id).set({from:uid,to:peer,ts:Date.now(),state:'ringing'});
  const off=await pc.createOffer();await pc.setLocalDescription(off);
  await db.collection('calls').doc(id).update({offer:{type:off.type,sdp:off.sdp}});
  CALL.un.push(db.collection('calls').doc(id).onSnapshot(async d=>{if(!CALL||CALL.id!==id)return;const x=d.data();if(!x)return;
   if(x.answer&&!pc.currentRemoteDescription){try{await pc.setRemoteDescription(x.answer);flushQ();CALL.state='connecting';ringStop();callUi()}catch(e){}}
   if(x.state==='declined'||x.state==='ended'||x.state==='missed')endCall(x.state,true)},()=>{}));
  watchIce(id);CALL.to=setTimeout(()=>{if(CALL&&CALL.id===id&&CALL.state==='ringing')endCall('missed')},45000)
 }catch(e){toast(L('sendErr'));endCall('ended')}}
async function acceptCall(){const c=CALL;if(!c||c.role!=='in'||c.pc)return;ringStop();clearTimeout(c.to);
 if(!window.RTCPeerConnection||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast(X('Звонки не поддерживаются этим браузером','Calls are not supported here'));endCall('declined');return}
 let st;try{st=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){toast(X('Нет доступа к микрофону','No microphone access'));endCall('declined');return}
 c.st=st;const pc=newPc(st,c.id);c.pc=pc;c.state='connecting';callUi();
 try{await pc.setRemoteDescription(c.offer);watchIce(c.id);flushQ();const ans=await pc.createAnswer();await pc.setLocalDescription(ans);await db.collection('calls').doc(c.id).update({state:'active',answer:{type:ans.type,sdp:ans.sdp}});
  c.un.push(db.collection('calls').doc(c.id).onSnapshot(d=>{const x=d.data();if(CALL&&CALL.id===c.id&&(!x||x.state==='ended'))endCall('ended',true)},()=>{}))
 }catch(e){toast(L('sendErr'));endCall('ended')}}
function callLog(peer,txt){if(!db||!uid)return;const ts=Date.now(),pair=dmPair(uid,peer);db.collection('dms').doc(pair).collection('msgs').doc(ts+'-'+rnd()).set({x:txt,by:uid,ts:ts,sys:1}).then(()=>{const b=db.batch();b.set(db.collection('inbox').doc(uid).collection('t').doc(pair),{with:peer,last:txt,ts:ts,by:uid});b.set(db.collection('inbox').doc(peer).collection('t').doc(pair),{with:uid,last:txt,ts:ts,by:uid});return b.commit()}).catch(()=>{})}
function cleanCall(id){db.collection('calls').doc(id).collection('ice').get().then(s=>{const b=db.batch();s.docs.forEach(d=>b.delete(d.ref));b.delete(db.collection('calls').doc(id));return b.commit()}).catch(()=>{})}
function endCall(state,remote){const c=CALL;if(!c)return;CALL=null;ringStop();clearTimeout(c.to);(c.un||[]).forEach(u=>{try{u()}catch(e){}});try{if(c.pc)c.pc.close()}catch(e){}try{if(c.st)c.st.getTracks().forEach(t=>t.stop())}catch(e){}const a=document.getElementById('callaud');if(a)a.remove();callUi();
 if(!remote&&db)db.collection('calls').doc(c.id).update({state:state}).catch(()=>{});
 if(c.role==='out'){const dur=c.t0?Math.round((Date.now()-c.t0)/1000):0,txt=dur?'📞 '+X('Звонок','Call')+' · '+mmss(dur):(state==='declined'?'📞 '+X('Звонок отклонён','Call declined'):'📞 '+X('Пропущенный звонок','Missed call'));callLog(c.peer,txt);setTimeout(()=>cleanCall(c.id),4000)}}
function watchCalls(){if(_vc||!db||!uid)return;_vc=true;
 db.collection('calls').where('to','==',uid).onSnapshot(s=>{s.docChanges().forEach(ch=>{if(ch.type==='removed')return;const x=ch.doc.data(),id=ch.doc.id;
  if(x.state==='ringing'&&x.offer&&!CALL&&Date.now()-x.ts<60000&&!blockedBy(x.from)){CALL={id:id,peer:x.from,role:'in',state:'ringing',offer:x.offer,un:[],q:[],mute:false,t0:0};callUi();ringStart();notify('📞 '+X('Звонок','Call'),nameOf(x.from),true);CALL.to=setTimeout(()=>{if(CALL&&CALL.id===id&&CALL.state==='ringing')endCall('missed',true)},50000)}
  else if(CALL&&CALL.id===id&&CALL.role==='in'&&CALL.state==='ringing'&&x.state!=='ringing')endCall(x.state,true)})},()=>{})}
function bindCallBtn(){const b=document.getElementById('callb');if(b){b.onclick=()=>{if(CURT.t==='dm')startCall(CURT.id)};b.style.display=CURT.t==='dm'?'':'none'}}
(function(){const pc=pageChat;pageChat=function(){pc();bindMic();bindCallBtn()};const ct=curTitle;curTitle=function(){const r=ct();const b=document.getElementById('callb');if(b)b.style.display=CURT.t==='dm'?'':'none';return r};const sv=startV3;startV3=function(){sv();watchCalls()}})();

init();
