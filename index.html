<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Орден</title>
<meta name="theme-color" content="#0a0a0c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0a0a0c;--sf:#13141a;--tx:#e0e0e0;--mu:#8d939b;--ac:#c0392b;--bd:#2a2d34;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
#bar{position:fixed;left:0;right:0;top:0;z-index:10;display:none;align-items:center;gap:10px;padding:min(env(safe-area-inset-top,0px),6px) 12px 6px;background:var(--sf);border-bottom:1px solid var(--bd);font:13px ui-monospace,Menlo,Consolas,monospace}
#bar.on{display:flex}
#bar .lg{color:var(--ac);font-weight:700;letter-spacing:.12em}
#bar .sp{flex:1}
#bar button{background:transparent;border:1px solid var(--bd);color:var(--tx);padding:4px 9px;font:12px ui-monospace,Menlo,Consolas,monospace;cursor:pointer}
#bar button:hover{border-color:var(--ac);color:var(--ac)}
#fr{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:var(--bg)}
#fr.off{top:38px;height:calc(100% - 38px)}
#st{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:24px;background:var(--bg);z-index:5;transition:opacity .35s}
#st.hide{opacity:0;pointer-events:none}
#st h1{margin:0;font:700 26px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.2em;color:var(--ac)}
#st p{margin:0;color:var(--mu);max-width:320px}
#st .dot{width:44px;height:44px;border:2px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#st button{background:linear-gradient(180deg,var(--ac),rgba(192,57,43,.72));border:0;color:#fff;padding:10px 18px;font:13px ui-monospace,Menlo,Consolas,monospace;cursor:pointer;letter-spacing:.1em}
#upd{position:fixed;left:10px;right:10px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:20;display:none;gap:10px;align-items:center;padding:10px 12px;background:var(--sf);border:1px solid var(--ac);font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.6)}
#upd.on{display:flex}
#upd span{flex:1}
#upd button{background:var(--ac);border:0;color:#fff;padding:7px 12px;font:12px ui-monospace,Menlo,Consolas,monospace;cursor:pointer}
#upd button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
</style>
</head>
<body>
<iframe id="fr" src="./site/index.html" title="Орден"></iframe>

<div id="st">
  <div class="dot"></div>
  <h1>ОРДЕН</h1>
  <p id="stm">Подключение к базе…</p>
  <button id="stb" style="display:none">Повторить</button>
</div>

<div id="bar">
  <span class="lg">ОРДЕН</span>
  <span id="vs" style="color:#8d939b">v…</span>
  <span class="sp"></span>
  <span id="nb" style="color:#3fb950">●</span>
  <button id="rf" title="Обновить">⟳</button>
</div>

<div id="upd"><span id="upt">Доступно обновление.</span><button id="upy">Обновить</button><button class="g" id="upn">Позже</button></div>

<script>
const FR = document.getElementById('fr');
const ST = document.getElementById('st');
const STM = document.getElementById('stm');
const STB = document.getElementById('stb');
const VS = document.getElementById('vs');
const NB = document.getElementById('nb');
const BAR = document.getElementById('bar');
const UPD = document.getElementById('upd');
const UPT = document.getElementById('upt');

let LIVE = '';          // версия, опубликованная на сайте (version.json)
let LOCAL = '';         // версия внутри приложения (version.txt)
let tries = 0;

function stok(msg, btn) {
  STM.textContent = msg;
  STB.style.display = btn ? 'inline-block' : 'none';
  ST.classList.remove('hide');
}
function sthide() { ST.classList.add('hide'); }
function setNet(ok) {
  NB.textContent = ok ? '● онлайн' : '○ нет сети';
  NB.style.color = ok ? '#3fb950' : '#f85149';
}

async function localVer() {
  try {
    const r = await fetch('version.txt?_=' + Date.now(), { cache: 'no-store' });
    if (r.ok) LOCAL = (await r.text()).trim();
  } catch (e) {}
  VS.textContent = 'v' + (LOCAL || '?');
  return LOCAL;
}
async function liveVer() {
  try {
    const r = await fetch('version.json?_=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return '';
    const j = await r.json();
    return String(j.version || '').trim();
  } catch (e) { return ''; }
}

async function loop() {
  await localVer();
  if (!navigator.onLine) {
    if (tries === 0) {
      stok('Нет сети. Приложение работает в автономном режиме: открываю сохранённую копию.', false);
      setTimeout(sthide, 1600);
    }
    return;
  }
  LIVE = await liveVer();
  if (LIVE && LOCAL && LIVE !== LOCAL) {
    UPT.textContent = 'Обновление ' + LIVE + ' на сервере. Обновить приложение?';
    UPD.classList.add('on');
    sthide();
    return;
  }
  sthide();
}
STB.onclick = () => { tries = 0; stok('Подключение к базе…', false); loop(); };

FR.addEventListener('load', () => {
  try {
    if (FR.contentWindow && FR.contentWindow.ordenApp && FR.contentWindow.ordenApp.ver) {
      const v = FR.contentWindow.ordenApp.ver();
      if (v && v !== '0.0.0') { VS.textContent = 'v' + v; LOCAL = v; sthide(); }
    }
  } catch (e) {}
});

document.getElementById('upy').onclick = () => {
  UPD.classList.remove('on');
  const u = FR.contentWindow;
  if (u && u.ordenApp && u.ordenApp.reload) { u.ordenApp.reload(); return; }
  FR.src = './site/index.html?ver=' + encodeURIComponent(LIVE || Date.now());
};
document.getElementById('upn').onclick = () => UPD.classList.remove('on');
document.getElementById('rf').onclick = () => {
  FR.src = './site/index.html?t=' + Date.now();
  vs();
};
function vs() {
  try {
    const v = FR.contentWindow && FR.contentWindow.ordenApp && FR.contentWindow.ordenApp.ver && FR.contentWindow.ordenApp.ver();
    if (v && v !== '0.0.0') VS.textContent = 'v' + v;
  } catch (e) {}
}

// --- Проверка сети и доступности базы ---
function pingOnce() {
  return new Promise(res => {
    const t = setTimeout(() => res(false), 6000);
    const URL_ = 'https://www.gstatic.com/generate_204?_=' + Date.now();
    fetch(URL_, { mode: 'no-cors', cache: 'no-store' })
      .then(() => { clearTimeout(t); res(true); })
      .catch(() => { clearTimeout(t); res(false); });
  });
}
async function netLoop() {
  const ok = navigator.onLine && await pingOnce();
  setNet(ok);
  if (!ok && tries < 2) {
    tries++;
    stok('Нет связи с интернетом. Проверьте Wi-Fi или мобильный интернет. Работает офлайн-копия.', true);
    sthide();
  }
}
setInterval(netLoop, 20000);
window.addEventListener('online', () => { loop(); netLoop(); });
window.addEventListener('offline', () => setNet(false));

// --- Сборка / офлайн ---
async function build() {
  await localVer();
  loop();
  netLoop();
  setInterval(loop, 10 * 60 * 1000);   // раз в 10 минут проверяем обновление
}
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
  let refreshed = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (refreshed) return;
    refreshed = true;
    FR.src = './site/index.html?t=' + Date.now();
  });
}
addEventListener('online', () => setNet(true));
addEventListener('offline', () => setNet(false));
build();
</script>
</body>
</html>
